<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="个人主页" />
  <title>你的名字 · 个人主页</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: rgba(255,255,255,.08);
      --text: #f5f7fb;
      --muted: #aab3c5;
      --accent: #8ab4ff;
      --border: rgba(255,255,255,.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(78, 128, 255, .24), transparent 32%),
        radial-gradient(circle at 80% 70%, rgba(141, 94, 255, .22), transparent 30%),
        var(--bg);
    }

    .card {
      width: min(760px, 100%);
      padding: 48px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--card);
      backdrop-filter: blur(18px);
      box-shadow: 0 24px 80px rgba(0,0,0,.28);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 8vw, 76px);
      line-height: .98;
      letter-spacing: -.045em;
    }

    .intro {
      margin: 24px 0 0;
      max-width: 600px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.8;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }

    .links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
      transition: .2s ease;
    }

    .links a:hover {
      transform: translateY(-2px);
      border-color: rgba(255,255,255,.3);
      background: rgba(255,255,255,.08);
    }

    footer {
      margin-top: 42px;
      color: #7e899f;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .card { padding: 32px 24px; border-radius: 22px; }
      .intro { font-size: 16px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Hello, I'm</p>
    <h1>你的名字</h1>
    <p class="intro">
      这里是我的个人主页。你可以把这段文字改成一句自我介绍，例如：
      “产品设计师 / 开发者 / 摄影爱好者，目前专注于有趣的互联网项目。”
    </p>

    <nav class="links" aria-label="个人链接">
      <a href="https://github.com/yourname" target="_blank" rel="noreferrer">GitHub</a>
      <a href="https://www.linkedin.com/" target="_blank" rel="noreferrer">LinkedIn</a>
      <a href="mailto:you@example.com">Email</a>
    </nav>

    <footer>© 2026 你的名字 · Built with plain HTML & CSS.</footer>
  </main>
</body>
</html>
